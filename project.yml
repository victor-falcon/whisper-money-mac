# Proyecto de Xcode generado con xcodegen:  xcodegen generate
# Tu Team ID va en Config/Team.local.xcconfig (fuera de git), ver README.
# El .xcodeproj no se versiona; se regenera desde este archivo.
name: WhisperMac
options:
  bundleIdPrefix: mx.diego
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(WHISPER_TEAM_ID)
    ENABLE_HARDENED_RUNTIME: YES

packages:
  WhisperKit:
    path: WhisperKit

targets:
  WhisperMac:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: WhisperKit
      - target: BudgetsWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Whisper Money
        LSApplicationCategoryType: public.app-category.finance
        KeychainAccessGroup: $(AppIdentifierPrefix)mx.diego.whispermac.shared
        CFBundleURLTypes:
          - CFBundleURLName: mx.diego.whispermac
            CFBundleURLSchemes: [whispermac]
    entitlements:
      path: App/WhisperMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)mx.diego.whispermac.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.diego.whispermac
        PRODUCT_NAME: WhisperMoney

  BudgetsWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    dependencies:
      - package: WhisperKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Presupuestos
        KeychainAccessGroup: $(AppIdentifierPrefix)mx.diego.whispermac.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BudgetsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)mx.diego.whispermac.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.diego.whispermac.budgets
        PRODUCT_NAME: BudgetsWidget
